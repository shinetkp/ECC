name: Claude Assistant

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    # Only the owner can spend subscription usage or request code changes.
    if: >-
      github.actor == 'shinetkp' &&
      github.event.sender.type == 'User' &&
      (
        (github.event_name == 'issues' && github.event.action == 'opened' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'ai:claude') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Check subscription authentication
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo '::error::CLAUDE_CODE_OAUTH_TOKEN is missing. Complete subscription setup before invoking Claude.'
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Respond with Claude subscription
        id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: ai:claude
          branch_name_template: 'fix/{{entityNumber}}-claude-${{ github.run_id }}'
          track_progress: 'true'
          restrict_untrusted_prs: 'true'
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 40
            --append-system-prompt "Follow AGENTS.md and read .github/CLAUDE_AUTOMATION.md before working. Never push to the default branch, merge a PR, deploy, publish, apply migrations, change production data, or access credentials. Report blockers instead."
      - name: Open a pull request for issue changes
        if: >-
          steps.claude.outputs.conclusion == 'success' &&
          steps.claude.outputs.branch_name != '' &&
          (github.event_name == 'issues' ||
            (github.event_name == 'issue_comment' && !github.event.issue.pull_request))
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
        with:
          github-token: ${{ steps.claude.outputs.github_token }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const branch = process.env.CLAUDE_BRANCH;
            const expected = `fix/${issue.number}-claude-${context.runId}`;
            if (branch !== expected) {
              core.setFailed('Claude branch did not match this issue and run. No PR was created.');
              return;
            }
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const base = repository.default_branch;
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${branch}`
            });
            if (comparison.ahead_by === 0 || !comparison.files?.length) {
              core.info('No committed file changes; no pull request is needed.');
              return;
            }
            const { data: existing } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, base
            });
            if (existing.length) {
              core.info(`Pull request already exists: ${existing[0].html_url}`);
              return;
            }
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, base, head: branch,
              title: `fix: ${issue.title}`.slice(0, 200),
              body: [
                `Refs #${issue.number}`,
                '',
                'Claude가 이 이슈의 요청에 따라 만든 수정 제안입니다.',
                `실행·검증·제한: ${runUrl} 및 원본 이슈의 Claude 댓글을 확인하세요.`,
                'PR 생성은 테스트 통과나 배포 완료를 뜻하지 않습니다. 기존 CI와 변경 내용을 검토한 뒤 소유자가 병합합니다.',
                '',
                '## 작업 에이전트',
                '- 생성·구현: Claude · 모델·추론 수준은 Actions 실행 기록 참고',
                '- 리뷰: 미실행'
              ].join('\n'),
              draft: false
            });
            if (['FINFlow', 'InitPJT', 'accountly'].includes(repo)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['claude'] });
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `Agent: Claude\n수정 PR: ${pr.html_url}\nCI·검증 결과와 변경 내용을 확인해 주세요. 자동 병합·배포는 실행하지 않았습니다.`
            });
